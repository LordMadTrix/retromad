<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="100%" stop-color="#161b2b"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#27314d" stroke-width="8"/>

  <!-- Glowing outer contour -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="url(#neonCyan)" stroke-width="3" opacity="0.3" filter="url(#glow)"/>

  <!-- Arcade Marquee / Top Header -->
  <path d="M120 110 L392 110 L416 170 L96 170 Z" fill="#1c2235" stroke="url(#neonPink)" stroke-width="6"/>
  <text x="256" y="152" fill="#ffffff" font-family="'Courier New', monospace" font-weight="900" font-size="34" letter-spacing="6" text-anchor="middle" filter="url(#glow)">RETROMAD</text>

  <!-- Arcade Screen Bezel -->
  <rect x="116" y="186" width="280" height="170" rx="18" fill="#080a10" stroke="url(#neonCyan)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Screen Grid Scanlines effect -->
  <line x1="126" y1="210" x2="386" y2="210" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>
  <line x1="126" y1="235" x2="386" y2="235" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>
  <line x1="126" y1="260" x2="386" y2="260" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>
  <line x1="126" y1="285" x2="386" y2="285" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>
  <line x1="126" y1="310" x2="386" y2="310" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>
  <line x1="126" y1="335" x2="386" y2="335" stroke="#00f2fe" stroke-width="2" opacity="0.2"/>

  <!-- Pixel Heart on screen -->
  <path d="M256 300 L236 280 A18 18 0 0 1 256 250 A18 18 0 0 1 276 280 Z" fill="url(#neonPink)" filter="url(#glow)"/>

  <!-- Arcade Control Panel Base -->
  <path d="M80 376 L432 376 L400 450 L112 450 Z" fill="#1c2235" stroke="#27314d" stroke-width="4"/>

  <!-- Joystick -->
  <rect x="175" y="395" width="10" height="30" rx="5" fill="#8a9ea7"/>
  <circle cx="180" cy="390" r="16" fill="url(#neonPink)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>

  <!-- Arcade Action Buttons -->
  <circle cx="280" cy="415" r="12" fill="url(#neonCyan)" filter="url(#glow)"/>
  <circle cx="315" cy="405" r="12" fill="url(#neonPink)" filter="url(#glow)"/>
  <circle cx="350" cy="415" r="12" fill="#ffd700" filter="url(#glow)"/>
</svg>
